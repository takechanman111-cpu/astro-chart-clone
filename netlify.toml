[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build:netlify && npm run check:deploy && bash compatibility/western/build.sh && (cd engine && npm run build && node --test tests/core.test.mjs tests/compatibility.test.mjs)"

[build.environment]
  NODE_VERSION = "22"
  ASTRO_TIMING_ENGINE = "swetest"
  SWETEST_PATH = "netlify/swiss/swetest"
  SWISS_EPHEMERIS_PATH = "netlify/swiss/ephe"

[functions]
  node_bundler = "esbuild"
  included_files = [
    "netlify/swiss/**",
    "compatibility/western/runtime/**",
    "engine/bin/vedic-swiss",
    "engine/vendor/swiss/ephe/**",
    "reference-fixtures/**",
    "reference-additional-validation-data.json"
  ]

[[redirects]]
  from = "/api/timing"
  to = "/.netlify/functions/timing"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/healthz"
  status = 200

[[redirects]]
  from = "/api/synastry"
  to = "/.netlify/functions/synastry"
  status = 200

[[redirects]]
  from = "/api/vedic-natal"
  to = "/.netlify/functions/vedic-natal"
  status = 200

[[redirects]]
  from = "/api/vedic-compatibility"
  to = "/.netlify/functions/vedic-compatibility"
  status = 200
